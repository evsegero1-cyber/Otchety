plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.sergey.otchety'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.sergey.otchety'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'otchety123'
            keyAlias 'otchety'
            keyPassword 'otchety123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
